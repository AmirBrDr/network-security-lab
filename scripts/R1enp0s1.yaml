network:
  version: 2
  ethernets:
    enp0s1:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      nameservers:
        addresses:
          - 172.16.0.2
          - 2001:678:3fc:3::2

  openvswitch: {}

  bridges:
    asw-host:
      openvswitch: {}


  vlans:
    # Infrastructure VLAN
    enp0s1.160:
      id: 160
      link: enp0s1
      addresses:
        - 10.0.160.130/27
        - 2001:678:3fc:a0::82/64
      routes:
        - to: default
          via: 10.0.160.129
        - to: "::/0"
          via: "fe80::a0:1"
          on-link: true
    # R1 -> R2
    enp0s1.440:
      id: 440
      link: enp0s1
      addresses:
        - 10.44.0.1/29
        - fe80::1b8:1/64
    # R1 -> R3
    enp0s1.441:
      id: 441
      link: enp0s1
      addresses:
        - 10.44.1.1/29
        - fe80::1b9:1/64
    # management
    enp0s1.99:
      id: 99
      link: enp0s1
      addresses:
        - 10.99.0.1/24
        - fd14:ca46:3864:99::1/64
    vlan10:
      id: 10
      link: asw-host
      addresses:
        - 10.10.0.1/24
        - fd14:ca46:3864:a::1/64