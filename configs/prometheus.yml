global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          node: management
          role: observability

  - job_name: node
    static_configs:
      - targets: ["10.99.0.1:9100"]
        labels:
          node: R1
          role: router
      - targets: ["10.99.0.2:9100"]
        labels:
          node: R2
          role: router
      - targets: ["10.99.0.3:9100"]
        labels:
          node: R3
          role: router
      - targets: ["10.99.0.65:9100"]
        labels:
          node: monitoring
          role: ids
      - targets: ["10.99.0.66:9100"]
        labels:
          node: management
          role: observability

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]
        labels:
          node: management
          role: logs
